#
# Structure:
#   categories:
#     <category_id>:
#       name: "Display Name"       # Shown in the UI
#       icon: "stone"              # Item/block for the button icon (optional)
#       items:
#         <item_id>:               # Minecraft item/block ID (e.g. stone, apple)
#           buy: <price>           # Purchase price (remove to make sell-only)
#           sell: <price>          # Sell price (remove to make buy-only)
#
# Examples:
#   stone:         buy: 10, sell: 5   → players can buy AND sell
#   diamond:       buy: 500           → buy-only, no sell price
#   gravel:        sell: 1            → sell-only, no buy price

